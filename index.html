<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Lab Voorraad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f4c4a'/%3E%3Cpath d='M26 12h12v4h-2v12l12 20a4 4 0 0 1-3.5 6h-25A4 4 0 0 1 16 48l12-20V16h-2z' fill='%23f2a93b'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f1ec; --kaart:#ffffff; --kaart2:#f8f7f3; --teks:#14211f; --sag:#5d6b69; --lyn:#e2ded5;
  --hoof:#0f4c4a; --hoof2:#16645f; --hoof-sag:#dcebe8; --amber:#f2a93b; --amber-sag:#fdf0d9;
  --goed:#1d7a4f; --goed-sag:#dff2e7; --fout:#b3362c; --fout-sag:#fbe3df; --waarsku:#a8650a;
  --skadu:0 1px 2px rgba(20,33,31,.06),0 4px 14px rgba(20,33,31,.06);
  --r:14px; --nav:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --kaart:#17201f; --kaart2:#1c2726; --teks:#e8eeec; --sag:#9aaba8; --lyn:#2a3735;
  --hoof:#5fb8ad; --hoof2:#7cc9bf; --hoof-sag:#1d3533; --amber:#f2b252; --amber-sag:#3a2d16;
  --goed:#5cc48d; --goed-sag:#173325; --fout:#ef7d71; --fout-sag:#3b1d1a; --waarsku:#f2b252;
  --skadu:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0e1514; --kaart:#17201f; --kaart2:#1c2726; --teks:#e8eeec; --sag:#9aaba8; --lyn:#2a3735;
  --hoof:#5fb8ad; --hoof2:#7cc9bf; --hoof-sag:#1d3533; --amber:#f2b252; --amber-sag:#3a2d16;
  --goed:#5cc48d; --goed-sag:#173325; --fout:#ef7d71; --fout-sag:#3b1d1a; --waarsku:#f2b252;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--teks);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.verberg{display:none!important}
.sag{color:var(--sag)} .klein{font-size:.85rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em}

/* kop */
.kop{position:sticky;top:0;z-index:20;background:var(--hoof);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
:root[data-theme="dark"] .kop{background:#123b39}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kop{background:#123b39}}
.kop .titel{flex:1;min-width:0}
.kop h1{font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kop .wie{font-size:.78rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sinc{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:0;border-radius:999px;padding:6px 10px;color:#fff;font-size:.8rem;cursor:pointer}
.sinc .kol{width:8px;height:8px;border-radius:50%;background:#7fe0b0}
.sinc.besig .kol{background:var(--amber);animation:pols 1s infinite}
.sinc.fout .kol{background:#ff8a7e}
@keyframes pols{50%{opacity:.3}}
.vorder{position:fixed;top:0;left:0;height:3px;background:var(--amber);z-index:50;width:0;transition:width .3s}

main{padding:14px 16px 24px;max-width:720px;margin:0 auto}

/* navigasie */
nav.onder{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--kaart);border-top:1px solid var(--lyn);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.onder button{flex:1;height:var(--nav);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;color:var(--sag);cursor:pointer}
nav.onder button svg{width:24px;height:24px}
nav.onder button.aan{color:var(--hoof);font-weight:700}
nav.onder button.aan svg{stroke-width:2.4}
nav.onder .ster{position:relative}
nav.onder .ster b{position:absolute;top:-4px;right:-10px;background:var(--fout);color:#fff;border-radius:999px;font-size:.62rem;padding:1px 5px;font-weight:700}

/* kaarte */
.kaart{background:var(--kaart);border-radius:var(--r);box-shadow:var(--skadu);padding:14px;margin-bottom:12px}
.kaart.plat{box-shadow:none;border:1px solid var(--lyn)}
.ry{display:flex;align-items:center;gap:10px}
.ry.tussen{justify-content:space-between}
.stapel>*+*{margin-top:10px}
.afdeling{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--sag);font-weight:700;margin:18px 2px 8px}

/* knoppies */
.kn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--lyn);background:var(--kaart);font-weight:600;cursor:pointer;text-decoration:none}
.kn:active{transform:scale(.98)}
.kn.hoof{background:var(--hoof);border-color:var(--hoof);color:#fff}
:root[data-theme="dark"] .kn.hoof{color:#0e1514}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kn.hoof{color:#0e1514}}
.kn.amber{background:var(--amber);border-color:var(--amber);color:#2b1d05}
.kn.gevaar{color:var(--fout);border-color:var(--fout-sag);background:var(--fout-sag)}
.kn.vol{width:100%}
.kn.klein{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:10px}
.kn[disabled]{opacity:.5;pointer-events:none}
.kn svg{width:20px;height:20px;flex:none}
.knrooster{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.knrooster .kn{min-height:52px}

/* skyfies vir modus */
.skyfies{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.skyfies::-webkit-scrollbar{display:none}
.skyf{flex:none;border:1px solid var(--lyn);background:var(--kaart);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;cursor:pointer}
.skyf.aan{background:var(--hoof);border-color:var(--hoof);color:#fff}
:root[data-theme="dark"] .skyf.aan{color:#0e1514}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .skyf.aan{color:#0e1514}}

/* vorms */
label.veld{display:block}
label.veld>span{display:block;font-size:.85rem;font-weight:600;color:var(--sag);margin:0 0 5px 2px}
input.inv,select.inv,textarea.inv{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--lyn);background:var(--kaart2);outline:none}
input.inv:focus,select.inv:focus,textarea.inv:focus{border-color:var(--hoof);box-shadow:0 0 0 3px var(--hoof-sag)}
textarea.inv{min-height:70px;resize:vertical}
.twee{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stapper{display:flex;align-items:stretch;border:1px solid var(--lyn);border-radius:12px;overflow:hidden;background:var(--kaart2)}
.stapper button{width:56px;border:0;background:var(--hoof-sag);color:var(--hoof);font-size:1.5rem;font-weight:700;cursor:pointer}
.stapper input{flex:1;min-width:0;border:0;background:none;text-align:center;font-size:1.3rem;font-weight:700;min-height:52px;outline:none}
.skakel{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.skakel input{width:44px;height:26px;appearance:none;background:var(--lyn);border-radius:999px;position:relative;cursor:pointer;flex:none;transition:background .2s}
.skakel input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.skakel input:checked{background:var(--hoof)}
.skakel input:checked::after{left:21px}
.merk{display:flex;flex-wrap:wrap;gap:8px}
.merk label{display:flex;align-items:center;gap:6px;border:1px solid var(--lyn);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:.92rem}
.merk input{accent-color:var(--hoof)}
.fout-boodskap{background:var(--fout-sag);color:var(--fout);border-radius:10px;padding:10px 12px;font-size:.92rem}

/* skandeerder */
.kamera{position:relative;background:#081110;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:#cfe;margin-bottom:12px}
.kamera video{width:100%;height:100%;object-fit:cover}
.kamera #h5leser{width:100%}
.kamera .raam{position:absolute;left:8%;right:8%;top:32%;bottom:32%;border:3px solid rgba(242,169,59,.95);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.28);pointer-events:none}
.kamera .raam::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:rgba(255,90,70,.85);animation:skandeer 1.6s ease-in-out infinite}
@keyframes skandeer{0%,100%{transform:translateY(-22px)}50%{transform:translateY(22px)}}
.kamera .leeg{text-align:center;padding:24px}
.kamera .leeg svg{width:54px;height:54px;opacity:.8}
.kamera .lig{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.5);border:0;color:#fff;border-radius:999px;width:44px;height:44px;cursor:pointer}
.flits{animation:flits .5s}
@keyframes flits{0%{box-shadow:0 0 0 4px var(--goed)}100%{box-shadow:none}}

/* item-kaart */
.item-kop{display:flex;gap:12px;align-items:flex-start}
.item-kop .ikoon{width:46px;height:46px;border-radius:12px;background:var(--hoof-sag);color:var(--hoof);display:flex;align-items:center;justify-content:center;flex:none}
.item-kop .ikoon svg{width:26px;height:26px}
.item-kop h2{font-size:1.15rem}
.totaal{font-size:2rem;font-weight:800;line-height:1;color:var(--hoof)}
.voorraadlys{margin:12px 0 0;padding:0;list-style:none;border-top:1px solid var(--lyn)}
.voorraadlys li{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--lyn);gap:10px}
.voorraadlys li b{font-variant-numeric:tabular-nums}
.etiket{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--hoof-sag);color:var(--hoof);white-space:nowrap}
.etiket.amber{background:var(--amber-sag);color:var(--waarsku)}
.etiket.rooi{background:var(--fout-sag);color:var(--fout)}
.etiket.groen{background:var(--goed-sag);color:var(--goed)}
.etiket.grys{background:var(--kaart2);color:var(--sag);border:1px solid var(--lyn)}

/* lyste */
.lys{background:var(--kaart);border-radius:var(--r);box-shadow:var(--skadu);overflow:hidden}
.lys .el{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--lyn);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.lys .el:last-child{border-bottom:0}
.lys .el:active{background:var(--kaart2)}
.lys .el .hoof-teks{flex:1;min-width:0}
.lys .el .hoof-teks b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lys .el .getal{font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums;text-align:right}
.lys .el.dof{opacity:.55}
.leeg-lys{padding:28px 16px;text-align:center;color:var(--sag)}
.soek{position:relative;margin-bottom:10px}
.soek svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--sag)}
.soek input{padding-left:40px}
.fab{position:fixed;right:18px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:18px;border:0;background:var(--amber);color:#2b1d05;box-shadow:0 6px 18px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.fab svg{width:28px;height:28px}

/* teëls */
.teëls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.teël{background:var(--kaart);border-radius:var(--r);box-shadow:var(--skadu);padding:14px;border:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:96px}
.teël svg{width:26px;height:26px;color:var(--hoof)}
.teël b{font-size:.98rem}
.teël small{color:var(--sag)}

/* blad (modal) */
.dek{position:fixed;inset:0;background:rgba(10,18,17,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:in .15s}
.blad{background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:op .2s ease-out;padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:700px){.dek{align-items:center}.blad{border-radius:20px}}
.blad-kop{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--lyn)}
.blad-kop h2{flex:1;font-size:1.08rem}
.blad-kop button{border:0;background:var(--kaart);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.2rem}
.blad-lyf{overflow-y:auto;padding:14px 16px 20px}
@keyframes in{from{opacity:0}}
@keyframes op{from{transform:translateY(40px)}}
.toast{animation:toastIn .2s}@keyframes toastIn{from{transform:translateY(10px);opacity:0}}

/* boodskappies */
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav) + 12px + env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:#14211f;color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:.93rem;max-width:520px}
.toast.goed{background:var(--goed)} .toast.fout{background:var(--fout)}
:root[data-theme="dark"] .toast.goed,:root[data-theme="dark"] .toast.fout{color:#0e1514}

/* aanmeld */
.voorblad{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px 40px;max-width:440px;margin:0 auto}
.logo{width:64px;height:64px;border-radius:18px;background:var(--hoof);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.logo svg{width:36px;height:36px;color:var(--amber)}
.voorblad h1{font-size:1.6rem;margin-bottom:6px}

/* etiket-voorskou */
.voorskou{background:#fff;color:#000;border:1px dashed #b9b4a8;border-radius:6px;padding:8px;text-align:center;width:220px;margin:0 auto}
.voorskou .n{font:700 12px Helvetica,Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.voorskou .s{font:9px Helvetica,Arial,sans-serif;color:#555}
.voorskou svg{width:100%;height:56px;display:block;margin:4px 0}
.voorskou .k{font:11px Helvetica,Arial,sans-serif}
.tel-ry{display:flex;align-items:center;gap:8px}
.tel-ry input{width:64px;text-align:center}
details.gevorderd summary{cursor:pointer;color:var(--sag);font-size:.9rem;padding:6px 2px}
</style>
</head>
<body>
<div class="vorder" id="vorder"></div>
<div id="app"></div>
<div class="toasts" id="toasts"></div>

<script>
'use strict';
/* =====================================================================
   INSTELLING: plak jou Apps Script Web app-URL tussen die aanhalingstekens.
   (Jy kan dit ook in die toep self invul by die eerste oopmaak.)
   ===================================================================== */
const STANDAARD_API = '';

/* ---------------------------------------------------------------------
   Klein hulpies
--------------------------------------------------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const stoor = {
  kry(k, s = null) { try { const v = localStorage.getItem(k); return v === null ? s : JSON.parse(v); } catch (e) { return s; } },
  stel(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  vee(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
const fmtN = n => { const v = Math.round((Number(n) || 0) * 100) / 100; return String(v).replace('.', ','); };
const twee = n => String(n).padStart(2, '0');
const fmtD = iso => { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? '—' : `${twee(d.getDate())}/${twee(d.getMonth() + 1)}/${d.getFullYear()}`; };
const fmtDT = iso => { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? '—' : `${fmtD(iso)} ${twee(d.getHours())}:${twee(d.getMinutes())}`; };
const isoDag = d => `${d.getFullYear()}-${twee(d.getMonth() + 1)}-${twee(d.getDate())}`;
const getal = v => { const n = Number(String(v ?? '').replace(',', '.')); return isNaN(n) ? NaN : n; };

const IK = {
  skandeer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>',
  voorraad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>',
  leen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>',
  etiket: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>',
  meer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
  fles: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.5 18.5A2 2 0 0 0 6.2 21.5h11.6a2 2 0 0 0 1.7-3L14 9V3M7 15h10"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  soek: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  kamera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  gebreek: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.5 18.5A2 2 0 0 0 6.2 21.5h11.6a2 2 0 0 0 1.7-3L14 9V3"/><path d="m11 12 2 3-2 2 1.5 3"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  klok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  plek: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>',
  mense: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>',
  rat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',

/* ---------------------------------------------------------------------
   Toestand (alles in die foon se geheue)
--------------------------------------------------------------------- */
const K = { api: 'dva_api', token: 'dva_token', kas: 'dva_kas', werk: 'dva_werk', modus: 'dva_modus', vinnig: 'dva_vinnig', etiket: 'dva_etiket' };
let API = stoor.kry(K.api, '') || STANDAARD_API;
const S = {
  token: stoor.kry(K.token, ''),
  gebruiker: null, liggings: [], items: [], voorraad: [], uitlenings: [], gebreek: [], log: [], gebruikers: [], versoeke: [],
  instellings: { skool: '', eposAan: true },
  blad: 'skandeer', gelaai: null, sincFout: false
};
let IX = { item: new Map(), lig: new Map() };

function herIndekseer() {
  IX.item = new Map(S.items.map(i => [i.barcode, i]));
  IX.lig = new Map(S.liggings.map(l => [l.id, l]));
}
const isAdmin = () => S.gebruiker?.rol === 'admin';
const ligNaam = id => IX.lig.get(id)?.naam || '(onbekend)';
const aktieweLiggings = () => S.liggings.filter(l => l.aktief).sort((a, b) => a.naam.localeCompare(b.naam));
const myLiggings = () => aktieweLiggings().filter(l => isAdmin() || (S.gebruiker?.liggings || []).includes(l.id));
const magLig = id => isAdmin() || (S.gebruiker?.liggings || []).includes(id);
const voorraadVan = (bc, lid) => S.voorraad.find(v => v.barcode === bc && v.liggingId === lid)?.hoeveelheid || 0;
const voorraadRye = bc => S.voorraad.filter(v => v.barcode === bc && magLig(v.liggingId) && IX.lig.get(v.liggingId)?.aktief);
const totaalVan = bc => voorraadRye(bc).reduce((s, v) => s + v.hoeveelheid, 0);
const oopLenings = bc => S.uitlenings.filter(l => l.status === 'oop' && (!bc || l.barcode === bc));
const versoekeVirMy = () => S.versoeke.filter(v => v.status === 'wag' && magLig(v.vanLigging) && v.versoekerId !== S.gebruiker?.id);
const isLaat = l => l.status === 'oop' && l.terugDatum && new Date(l.terugDatum) < new Date();
const uitstaande = l => Math.round((l.hoeveelheid - l.terugGegee) * 100) / 100;

function werkLigging() {
  const m = myLiggings();
  let id = stoor.kry(K.werk, '');
  if (!m.find(l => l.id === id)) id = m[0]?.id || '';
  return id;
}

function bewaarKas() {
  stoor.stel(K.kas, {
    gebruiker: S.gebruiker, liggings: S.liggings, items: S.items, voorraad: S.voorraad, uitlenings: S.uitlenings,
    gebreek: S.gebreek, log: S.log.slice(-400), gebruikers: S.gebruikers, versoeke: S.versoeke, instellings: S.instellings, gelaai: S.gelaai
  });
}

/* ---------------------------------------------------------------------
   Kommunikasie met die bediener
--------------------------------------------------------------------- */
let besig = 0;
function vorder(aan) {
  besig += aan ? 1 : -1;
  const v = $('#vorder');
  v.style.width = besig > 0 ? '70%' : '100%';
  if (besig <= 0) { besig = 0; setTimeout(() => { if (!besig) v.style.width = '0'; }, 250); }
  const s = $('.sinc');
  if (s) { s.classList.toggle('besig', besig > 0); s.classList.toggle('fout', !besig && S.sincFout); }
}

async function api(aksie, data = {}) {
  if (!API) throw new Error('Die bediener-URL is nie ingestel nie.');
  vorder(true);
  try {
    let antw;
    try {
      const r = await fetch(API, {
        method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ aksie, token: S.token, data })
      });
      antw = await r.json();
    } catch (e) {
      S.sincFout = true;
      throw new Error(navigator.onLine === false ? 'Geen internet nie. Probeer weer.' : 'Kon nie die bediener bereik nie. Kontroleer die internet en probeer weer.');
    }
    S.sincFout = false;
    if (!antw.ok) {
      if (String(antw.fout).startsWith('MELD_AAN:')) { meldAf(String(antw.fout).slice(9).trim()); throw new Error(String(antw.fout).slice(9).trim()); }
      throw new Error(antw.fout || 'Onbekende fout');
    }
    return antw.data;
  } finally { vorder(false); }
}

// Skryf-aksies loop een-vir-een in volgorde (belangrik met vinnige skandering)
let ketting = Promise.resolve();
let wagtend = 0;
function skryf(aksie, data) {
  wagtend++;
  const p = ketting.then(() => api(aksie, data)).then(res => { pasToe(res); return res; })
    .finally(() => { wagtend--; });
  ketting = p.catch(() => { });
  return p;
}

function upsert(lys, rek, sleutel) {
  const i = lys.findIndex(sleutel);
  if (i >= 0) lys[i] = rek; else lys.push(rek);
}
function pasToe(res) {
  if (!res) return;
  (res.voorraad || []).forEach(v => upsert(S.voorraad, v, x => x.barcode === v.barcode && x.liggingId === v.liggingId));
  if (res.item) upsert(S.items, res.item, x => x.barcode === res.item.barcode);
  if (res.uitleen) upsert(S.uitlenings, res.uitleen, x => x.id === res.uitleen.id);
  if (res.gebreek) upsert(S.gebreek, res.gebreek, x => x.id === res.gebreek.id);
  if (res.versoek) upsert(S.versoeke, res.versoek, x => x.id === res.versoek.id);
  if (res.ligging) upsert(S.liggings, res.ligging, x => x.id === res.ligging.id);
  if (res.gebruiker) {
    if (isAdmin()) upsert(S.gebruikers, res.gebruiker, x => x.id === res.gebruiker.id);
    if (res.gebruiker.id === S.gebruiker?.id) S.gebruiker = res.gebruiker;
  }
  herIndekseer();
  bewaarKas();
}
function plaaslikeLog(aksie, barcode, liggingId, hoeveelheid, nota) {
  S.log.push({ tyd: new Date().toISOString(), gebruiker: S.gebruiker?.naam || '', aksie, barcode, liggingId, hoeveelheid, nota: nota || '' });
}

async function laaiAlles(stil) {
  try {
    const d = await api('laai');
    Object.assign(S, {
      gebruiker: d.gebruiker, liggings: d.liggings, items: d.items, voorraad: d.voorraad, uitlenings: d.uitlenings,
      gebreek: d.gebreek, log: d.log, gebruikers: d.gebruikers || [], versoeke: d.versoeke || [], instellings: d.instellings, gelaai: new Date().toISOString()
    });
    herIndekseer();
    bewaarKas();
    if (S.gebruiker.moetVerander) return wysVeranderWagwoord(true);
    teken();
    if (!stil) toast('Data is opgedateer', 'goed');
  } catch (e) {
    if (S.token) { teken(); toast(e.message, 'fout'); }
  }
}

function meldAf(boodskap) {
  Skandeerder.stop();
  S.token = ''; S.gebruiker = null;
  stoor.vee(K.token); stoor.vee(K.kas);
  sluitAlleBlaaie();
  wysAanmeld(boodskap);
}

/* ---------------------------------------------------------------------
   Boodskappies, blaaie (modals) en klank
--------------------------------------------------------------------- */
function toast(t, soort = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + soort;
  el.textContent = t;
  const h = $('#toasts');
  h.appendChild(el);
  while (h.children.length > 2) h.firstElementChild.remove();
  setTimeout(() => el.remove(), soort === 'fout' ? 5200 : 2600);
}

const blaaie = [];
function maakBlad(titel, html, by) {
  const dek = document.createElement('div');
  dek.className = 'dek';
  dek.innerHTML = `<div class="blad" role="dialog" aria-modal="true"><div class="blad-kop"><h2>${esc(titel)}</h2><button aria-label="Maak toe">✕</button></div><div class="blad-lyf">${html}</div></div>`;
  document.body.appendChild(dek);
  const blad = { dek, lyf: $('.blad-lyf', dek), toe: null };
  const sluit = () => {
    dek.remove();
    const i = blaaie.indexOf(blad); if (i >= 0) blaaie.splice(i, 1);
    if (blad.toe) blad.toe();
    if (!blaaie.length) Skandeerder.hervat();
  };
  blad.sluit = sluit;
  $('.blad-kop button', dek).onclick = sluit;
  dek.addEventListener('click', e => { if (e.target === dek) sluit(); });
  blaaie.push(blad);
  Skandeerder.pouse();
  if (by) by(blad);
  const eerste = $('input:not([type=checkbox]):not([readonly]),select,textarea', blad.lyf);
  if (eerste && eerste.dataset.fokus !== 'nee' && !matchMedia('(pointer:coarse)').matches) eerste.focus();
  return blad;
}
function sluitAlleBlaaie() { while (blaaie.length) blaaie[blaaie.length - 1].sluit(); }

let klank;
function piep(goed = true) {
  try {
    klank = klank || new (window.AudioContext || window.webkitAudioContext)();
    const o = klank.createOscillator(), g = klank.createGain();
    o.frequency.value = goed ? 1250 : 330; o.type = 'square';
    g.gain.setValueAtTime(.08, klank.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, klank.currentTime + (goed ? .09 : .25));
    o.connect(g); g.connect(klank.destination); o.start(); o.stop(klank.currentTime + .26);
  } catch (e) { }
  if (navigator.vibrate) navigator.vibrate(goed ? 40 : [80, 60, 80]);
}

function bevestig(vraag, jaTeks = 'Ja', gevaar = false) {
  return new Promise(res => {
    let antwoord = false;
    const b = maakBlad('Seker?', `<p style="margin-top:0">${esc(vraag)}</p><div class="twee"><button class="kn" data-n>Kanselleer</button><button class="kn ${gevaar ? 'gevaar' : 'hoof'}" data-j>${esc(jaTeks)}</button></div>`);
    b.toe = () => res(antwoord);
    $('[data-n]', b.lyf).onclick = () => b.sluit();
    $('[data-j]', b.lyf).onclick = () => { antwoord = true; b.sluit(); };
  });
}

/* Knoppie wat besig is: voorkom dubbel-druk */
async function metKnop(kn, fn) {
  if (kn.disabled) return;
  const teks = kn.innerHTML;
  kn.disabled = true; kn.innerHTML = 'Besig…';
  try { await fn(); } finally { if (kn.isConnected) { kn.disabled = false; kn.innerHTML = teks; } }
}
function wysFout(houer, e) {
  let f = $('.fout-boodskap', houer);
  if (!f) { f = document.createElement('div'); f.className = 'fout-boodskap'; houer.prepend(f); }
  f.textContent = e.message || String(e);
  f.scrollIntoView({ block: 'nearest' });
  piep(false);
}

function naAanmeld(r) {

function wysVeranderWagwoord(verpligtend) {
  const html = `<form class="stapel" id="ww">

    <label class="veld"><span>Herhaal nuwe wagwoord</span><input class="inv" name="nuut2" type="password" minlength="6" required autocomplete="new-password"></label>
    <button class="kn hoof vol">Stoor wagwoord</button>
    ${verpligtend ? '<button type="button" class="kn vol klein" id="af">Meld af</button>' : ''}
  </form>`;
  const doen = async (form) => {
    const f = Object.fromEntries(new FormData(form));
    if (f.nuut !== f.nuut2) return wysFout(form, new Error('Die nuwe wagwoorde stem nie ooreen nie.'));
    await metKnop($('button', form), async () => {
      try {
        const r = await api('verander_wagwoord', { oud: f.oud, nuut: f.nuut });
        S.gebruiker = r.gebruiker;
        toast('Wagwoord verander', 'goed');
        if (verpligtend) naAanmeld({ token: S.token, gebruiker: r.gebruiker }); else sluitAlleBlaaie();
      } catch (err) { wysFout(form, err); }
    });
  };
  if (verpligtend) {
    document.body.style.paddingBottom = '0';
    $('#app').innerHTML = `<div class="voorblad">${LOGO}<h1>Nuwe wagwoord</h1>${html}</div>`;
    $('#af').onclick = () => meldAf();
    $('#ww').onsubmit = e => { e.preventDefault(); doen(e.target); };
  } else {
    const b = maakBlad('Verander wagwoord', html);
    $('#ww', b.lyf).onsubmit = e => { e.preventDefault(); doen(e.target); };
  }
}

      <div class="skyfies" id="modusse">${MODUSSE.map(([k, n]) => `<button class="skyf ${k === modus ? 'aan' : ''}" data-m="${k}">${n}</button>`).join('')}</div>
      <label class="skakel ${modus === 'in' || modus === 'uit' ? '' : 'verberg'}" id="vinnigRy"><input type="checkbox" id="vinnig" ${vinnig ? 'checked' : ''}><span><b>Vinnige modus</b> <span class="sag klein">— elke skandering tel dadelik ${modus === 'uit' ? 'af' : 'by'}</span></span></label>
      <div class="tel-ry ${vinnig && (modus === 'in' || modus === 'uit') ? '' : 'verberg'}" id="vinnigHv"><span class="sag klein">Hoeveel per skandering:</span><input class="inv" id="perSkan" type="number" inputmode="decimal" min="0.01" step="any" value="${stoor.kry('dva_perskan', 1)}"></div>
    </div>
    <div class="kamera" id="kamera"><div class="leeg">${IK.kamera}<p>Druk <b>Begin kamera</b> en hou die strepieskode in die raam.</p></div></div>
    <div class="twee" style="margin-bottom:12px"><button class="kn hoof" id="kamKnop">${IK.kamera}<span>Begin kamera</span></button>
      <button class="kn" id="soekKnop">${IK.soek}<span>Soek item</span></button></div>
    <form id="tik" class="soek"><span>${IK.skandeer}</span><input class="inv mono" id="kode" placeholder="Tik kode of gebruik 'n skandeerder" autocomplete="off" autocapitalize="characters" enterkeyhint="go"></form>
    <div id="resultaat"></div>`;

  $('select[name=werk]').onchange = e => { stoor.stel(K.werk, e.target.value); if (laasteKode) wysResultaat(laasteKode); };
  const wysVinnig = () => {
    const md = stoor.kry(K.modus, 'kyk'), telbaar = md === 'in' || md === 'uit';
    $('#vinnigRy').classList.toggle('verberg', !telbaar);
    $('#vinnigRy .klein').textContent = `— elke skandering tel dadelik ${md === 'uit' ? 'af' : 'by'}`;
    $('#vinnigHv').classList.toggle('verberg', !(telbaar && $('#vinnig').checked));
  };
  $$('#modusse .skyf').forEach(b => b.onclick = () => {
    stoor.stel(K.modus, b.dataset.m);
    $$('#modusse .skyf').forEach(x => x.classList.toggle('aan', x === b));
    wysVinnig();
  });
  $('#vinnig').onchange = e => { stoor.stel(K.vinnig, e.target.checked); wysVinnig(); };
  $('#perSkan').onchange = e => stoor.stel('dva_perskan', getal(e.target.value) > 0 ? getal(e.target.value) : 1);
  $('#tik').onsubmit = e => { e.preventDefault(); const k = $('#kode').value.trim(); if (k) { $('#kode').value = ''; hanteerKode(k, true); } };
  $('#soekKnop').onclick = () => kiesItem({ titel: 'Soek item', by: it => hanteerKode(it.barcode, true) });
  const begin = () => Skandeerder.begin($('#kamera'), k => hanteerKode(k, false)).then(ok => { if (ok) kamKnop(true); });
  const kamKnop = aan => { const k = $('#kamKnop'); if (!k) return; k.innerHTML = aan ? `${IK.kamera}<span>Stop kamera</span>` : `${IK.kamera}<span>Begin kamera</span>`; k.classList.toggle('hoof', !aan); };
  $('#kamKnop').onclick = () => { if (Skandeerder.aan) { Skandeerder.stop(); kamKnop(false); tekenSkandeer(); } else begin(); };
  Skandeerder.opStop = () => kamKnop(false);
  if (laasteKode) wysResultaat(laasteKode);
}

function hanteerKode(kode, handmatig) {
  kode = String(kode).trim();
  laasteKode = kode;
  const item = IX.item.get(kode) || S.items.find(i => i.barcode.toLowerCase() === kode.toLowerCase());
  const modus = stoor.kry(K.modus, 'kyk');
  const lig = werkLigging();
  piep(!!item);
  const kam = $('#kamera'); if (kam) { kam.classList.remove('flits'); void kam.offsetWidth; kam.classList.add('flits'); }

  if (!item || !item.aktief) { wysResultaat(kode); return; }
  laasteKode = item.barcode;

  if (stoor.kry(K.vinnig, false) && (modus === 'in' || modus === 'uit') && !handmatig) {
    const hv = stoor.kry('dva_perskan', 1);
    const aksie = modus === 'in' ? 'voorraad_in' : 'voorraad_uit';
    // Wys dadelik plaaslik, bevestig met bediener
    const vorige = voorraadVan(item.barcode, lig);
    const nuut = vorige + (modus === 'in' ? hv : -hv);
    if (nuut < 0) { toast(`${item.naam}: nie genoeg voorraad nie (${fmtN(vorige)})`, 'fout'); piep(false); return wysResultaat(item.barcode); }
    upsert(S.voorraad, { barcode: item.barcode, liggingId: lig, hoeveelheid: nuut }, x => x.barcode === item.barcode && x.liggingId === lig);
    wysResultaat(item.barcode);
    toast(`${modus === 'in' ? '+' : '−'}${fmtN(hv)} ${item.naam} → ${fmtN(nuut)}`, 'goed');
    skryf(aksie, { barcode: item.barcode, liggingId: lig, hoeveelheid: hv, nota: 'Vinnige skandering' })
      .then(() => { plaaslikeLog(modus === 'in' ? 'IN' : 'UIT', item.barcode, lig, hv, 'Vinnige skandering'); if (laasteKode === item.barcode && $('#resultaat')) wysResultaat(item.barcode); })
      .catch(e => {
        upsert(S.voorraad, { barcode: item.barcode, liggingId: lig, hoeveelheid: vorige }, x => x.barcode === item.barcode && x.liggingId === lig);
        toast(`${item.naam}: ${e.message}`, 'fout'); piep(false);
        laaiAlles(true);
      });
    return;
  }
  wysResultaat(item.barcode);
  if (modus !== 'kyk') openAksie(modus, item.barcode, lig);
}

function wysResultaat(kode) {
  const r = $('#resultaat'); if (!r) return;
  const item = IX.item.get(kode);
  if (!item || !item.aktief) {
    r.innerHTML = `<div class="kaart stapel"><div class="item-kop"><div class="ikoon">${IK.soek}</div><div><h2>Onbekende kode</h2><div class="mono sag">${esc(kode)}</div></div></div>
      <p class="sag" style="margin:0">${item && !item.aktief ? 'Hierdie item is verwyder.' : 'Hierdie strepieskode is nog nie in die stelsel nie.'}</p>
      ${item && !item.aktief ? (isAdmin() ? '<button class="kn hoof vol" id="herstel">Herstel item</button>' : '') : `<button class="kn hoof vol" id="nuut">${IK.plus}<span>Voeg as nuwe item by</span></button>`}</div>`;
    if ($('#nuut')) $('#nuut').onclick = () => wysItemVorm(null, kode);
    if ($('#herstel')) $('#herstel').onclick = () => herstelItem(item);
    return;
  }
  r.innerHTML = itemKaart(item, true);
  koppelItemKaart(r, item);
}

/* ---------------------------------------------------------------------
   Kamera-skandeerder: gebruik die foon se ingeboude leser (Android),
   anders html5-qrcode (iPhone ens.)
--------------------------------------------------------------------- */
const Skandeerder = {
  aan: false, gepouseer: false, stroom: null, lus: null, h5: null, laas: { k: '', t: 0 }, opKode: null, opStop: null,
  async begin(houer, opKode) {
    this.stop(true);
    this.opKode = opKode; this.gepouseer = false;
    if (!window.isSecureContext) { toast('Die kamera werk net op https://-adresse.', 'fout'); return false; }
    houer.innerHTML = '<div class="leeg"><p>Begin kamera…</p></div>';
    try {
      if ('BarcodeDetector' in window) {
        const wil = ['code_128', 'code_39', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'qr_code', 'itf', 'codabar'];
        let formate = wil;
        try { const ond = await BarcodeDetector.getSupportedFormats(); formate = wil.filter(f => ond.includes(f)); } catch (e) { }
        if (formate.length) return await this.begininheems(houer, formate);
      }
      return await this.beginH5(houer);
    } catch (e) {
      this.stop();
      houer.innerHTML = `<div class="leeg">${IK.kamera}<p>${esc(kameraFout(e))}</p></div>`;
      return false;
    }
  },
  async begininheems(houer, formate) {
    const leser = new BarcodeDetector({ formats: formate });
    this.stroom = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    houer.innerHTML = '<video playsinline muted autoplay></video><div class="raam"></div>';
    const vid = $('video', houer);
    vid.srcObject = this.stroom;
    await vid.play();
    this.aan = true;
    const spoor = this.stroom.getVideoTracks()[0];
    try {
      if (spoor.getCapabilities && spoor.getCapabilities().torch) {
        const kn = document.createElement('button'); kn.className = 'lig'; kn.innerHTML = IK.flits; kn.title = 'Flits';
        let flits = false;
        kn.onclick = () => { flits = !flits; spoor.applyConstraints({ advanced: [{ torch: flits }] }).catch(() => { }); };
        houer.appendChild(kn);
      }
    } catch (e) { }
    let besig = false;
    this.lus = setInterval(async () => {
      if (!this.aan || this.gepouseer || besig || vid.readyState < 2) return;
      besig = true;
      try { const r = await leser.detect(vid); if (r && r[0]) this.gevind(r[0].rawValue); } catch (e) { }
      besig = false;
    }, 140);
    return true;
  },
  async beginH5(houer) {
    if (!window.Html5Qrcode) {
      houer.innerHTML = '<div class="leeg"><p>Laai skandeerder…</p></div>';
      await laaiSkrip(['https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js', 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js']);
    }
    houer.innerHTML = '<div id="h5leser"></div>';
    const F = window.Html5QrcodeSupportedFormats;
    this.h5 = new Html5Qrcode('h5leser', {
      verbose: false,
      formatsToSupport: [F.CODE_128, F.CODE_39, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.QR_CODE, F.ITF, F.CODABAR],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    });
    await this.h5.start({ facingMode: 'environment' },
      { fps: 12, qrbox: (w, h) => ({ width: Math.floor(Math.min(w * .86, 420)), height: Math.floor(Math.min(h * .45, 180)) }) },
      txt => { if (!this.gepouseer) this.gevind(txt); }, () => { });
    this.aan = true;
    return true;
  },
  gevind(k) {
    const nou = Date.now();
    if (k === this.laas.k && nou - this.laas.t < 2200) return;
    this.laas = { k, t: nou };
    if (this.opKode) this.opKode(k);
  },
  pouse() { this.gepouseer = true; },
  hervat() { this.gepouseer = false; this.laas.t = Date.now(); },
  stop(stil) {
    const was = this.aan;
    this.aan = false;
    clearInterval(this.lus); this.lus = null;
    if (this.stroom) { this.stroom.getTracks().forEach(t => t.stop()); this.stroom = null; }
    if (this.h5) { const h = this.h5; this.h5 = null; h.stop().then(() => h.clear()).catch(() => { }); }
    if (was && !stil && this.opStop) this.opStop();
  }
};
function kameraFout(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError') return 'Toegang tot die kamera is geweier. Gee toestemming in die blaaier se instellings en probeer weer.';
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'Geen kamera gevind nie.';
  if (n === 'NotReadableError') return 'Die kamera word deur \'n ander toep gebruik.';
  return 'Kon nie die kamera begin nie. Jy kan die kode steeds hieronder intik.';
}
function laaiSkrip(urls) {
  return urls.reduce((p, url) => p.catch(() => new Promise((ok, nee) => {
    const s = document.createElement('script'); s.src = url; s.onload = ok; s.onerror = () => { s.remove(); nee(new Error('laai')); };
    document.head.appendChild(s);
  })), Promise.reject());
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (Skandeerder.aan) { Skandeerder.stop(); } }
  else if (S.gebruiker && S.gelaai && Date.now() - new Date(S.gelaai) > 120000 && !blaaie.length) laaiAlles(true);
});

/* ---------------------------------------------------------------------
   Item-kaart en aksies
--------------------------------------------------------------------- */
function itemKaart(item, metKnoppies) {
  const rye = voorraadRye(item.barcode).sort((a, b) => ligNaam(a.liggingId).localeCompare(ligNaam(b.liggingId)));
  const tot = totaalVan(item.barcode);
  const lenings = oopLenings(item.barcode);
  const laag = isAdmin() && item.minVoorraad > 0 && tot < item.minVoorraad;
  const elders = item.aktief ? eldersBeskikbaar(item.barcode) : [];
  return `<div class="kaart">
    <div class="item-kop"><div class="ikoon">${IK.fles}</div>
      <div style="flex:1;min-width:0"><h2>${esc(item.naam)}</h2>
        <div class="sag klein"><span class="mono">${esc(item.barcode)}</span>${item.kategorie ? ' · ' + esc(item.kategorie) : ''}</div></div>
      <div style="text-align:right"><div class="totaal">${fmtN(tot)}</div><div class="sag klein">${esc(item.eenheid || 'stuks')}${isAdmin() ? '' : ' in jou liggings'}</div></div></div>
    ${laag ? `<p style="margin:10px 0 0"><span class="etiket amber">Lae voorraad · minimum ${fmtN(item.minVoorraad)}</span></p>` : ''}
    <ul class="voorraadlys">${rye.length ? rye.map(v => `<li><span>${esc(ligNaam(v.liggingId))}</span><b>${fmtN(v.hoeveelheid)}</b></li>`).join('') : '<li class="sag">Nog geen voorraad in jou liggings nie.</li>'}
    ${lenings.map(l => `<li><span><span class="etiket ${isLaat(l) ? 'rooi' : 'amber'}">${isLaat(l) ? 'Laat' : 'Uitgeleen'}</span> ${esc(ligNaam(l.vanLigging))} → ${esc(ligNaam(l.naLigging))}<br><span class="sag klein">${esc(l.persoon)} · terug ${fmtD(l.terugDatum)}</span></span><b>${fmtN(uitstaande(l))}</b></li>`).join('')}</ul>
    ${elders.length ? `<div class="sag klein" style="margin:14px 2px 0;font-weight:700;text-transform:uppercase;letter-spacing:.06em">Elders beskikbaar</div>
      <ul class="voorraadlys" style="border-top:0;margin-top:4px">${elders.map(v => `<li><span>${esc(ligNaam(v.liggingId))} <b>${fmtN(v.hoeveelheid)}</b></span><button class="kn klein" data-vs="${esc(v.liggingId)}">Versoek</button></li>`).join('')}</ul>` : ''}
    ${metKnoppies ? `<div class="knrooster" style="margin-top:12px">
      <button class="kn" data-a="in">＋ In</button><button class="kn" data-a="uit">－ Uit</button>
      <button class="kn" data-a="leen">${IK.leen}<span>Leen uit</span></button><button class="kn" data-a="gebreek">${IK.gebreek}<span>Gebreek</span></button>
      <button class="kn" data-a="tel">Tel / stel</button><button class="kn" data-a="meer">Meer…</button></div>` : ''}
  </div>`;
}
function koppelItemKaart(houer, item) {
  $$('[data-vs]', houer).forEach(b => b.onclick = () => versoekVorm(item.barcode, b.dataset.vs));
  $$('[data-a]', houer).forEach(b => b.onclick = () => {
    if (b.dataset.a === 'meer') return wysItemDetail(item.barcode);
    openAksie(b.dataset.a, item.barcode, werkLigging());
  });
}

const AKSIE_TITEL = { in: 'Voorraad in', uit: 'Voorraad uit', tel: 'Tel / stel voorraad', leen: 'Leen uit', gebreek: 'Meld gebreek' };

function openAksie(modus, barcode, lig) {
  const item = IX.item.get(barcode);
  if (!item) return;
  const m = myLiggings();
  if (!m.length) return toast('Jy het nie toegang tot enige ligging nie.', 'fout');
  if (!m.find(l => l.id === lig)) lig = m[0].id;
  const terug = new Date(); terug.setDate(terug.getDate() + 7);
  const huidig = voorraadVan(barcode, lig);
  const stapper = (w = 1) => `<div class="stapper"><button type="button" data-d="-1">−</button><input name="hoeveelheid" type="number" inputmode="decimal" step="any" min="0" value="${w}" data-fokus="nee"><button type="button" data-d="1">+</button></div>`;
  const ander = aktieweLiggings().filter(l => l.id !== lig);

  let lyf = `<div class="ry tussen" style="margin-bottom:12px"><div><b>${esc(item.naam)}</b><div class="sag klein mono">${esc(item.barcode)}</div></div>
    <div style="text-align:right"><div class="sag klein">Huidig hier</div><b id="huidig">${fmtN(huidig)}</b> <span class="sag klein">${esc(item.eenheid || '')}</span></div></div>
    <form class="stapel" id="af">
    <label class="veld"><span>${modus === 'leen' ? 'Leen uit van' : 'Ligging'}</span>${ligKeuse('lig', lig)}</label>`;
  if (modus === 'tel') lyf += `<label class="veld"><span>Werklike telling</span>${stapper(huidig)}</label>`;
  else lyf += `<label class="veld"><span>Hoeveelheid</span>${stapper(1)}</label>`;
  if (modus === 'leen') {
    lyf += `<label class="veld"><span>Leen uit na</span>${ligKeuse('na', '', ander, 'Kies lab / klas…')}</label>
      <label class="veld"><span>Wie teken uit?</span><input class="inv" name="persoon" required placeholder="Naam en van" autocomplete="off"></label>
      <div class="twee"><label class="veld"><span>E-pos (vir kwitansie)</span><input class="inv" name="epos" type="email" placeholder="opsioneel"></label>
      <label class="veld"><span>Selfoon</span><input class="inv" name="selfoon" type="tel" placeholder="opsioneel"></label></div>
      <label class="veld"><span>Terug teen</span><input class="inv" name="terugDatum" type="date" value="${isoDag(terug)}" min="${isoDag(new Date())}"></label>`;
  }
  if (modus === 'gebreek') lyf += `<label class="veld"><span>Wat het gebeur?</span><textarea class="inv" name="rede" placeholder="bv. Geval tydens prakties, gekraak"></textarea></label>`;
  if (modus === 'in' || modus === 'uit' || modus === 'leen') lyf += `<label class="veld"><span>Nota</span><input class="inv" name="nota" placeholder="opsioneel"></label>`;
  lyf += `<button class="kn ${modus === 'gebreek' ? 'gevaar' : 'hoof'} vol">${{ in: 'Voeg by voorraad', uit: 'Haal uit voorraad', tel: 'Stoor telling', leen: 'Leen uit', gebreek: 'Meld as gebreek' }[modus]}</button></form>`;

  const b = maakBlad(AKSIE_TITEL[modus], lyf, blad => {
    const f = $('#af', blad.lyf);
    const hv = f.hoeveelheid;
    $$('.stapper button', f).forEach(k => k.onclick = () => { const n = getal(hv.value) || 0; hv.value = Math.max(0, Math.round((n + Number(k.dataset.d)) * 100) / 100); });
    f.lig.onchange = () => {
      $('#huidig', blad.lyf).textContent = fmtN(voorraadVan(barcode, f.lig.value));
      if (modus === 'tel') hv.value = voorraadVan(barcode, f.lig.value);
      if (f.na) { const nu = f.na.value; f.na.outerHTML = ligKeuse('na', nu, aktieweLiggings().filter(l => l.id !== f.lig.value), 'Kies lab / klas…'); }
    };
    f.onsubmit = async e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(f));
      const n = getal(d.hoeveelheid);
      if (isNaN(n) || n < 0 || (modus !== 'tel' && n <= 0)) return wysFout(f, new Error('Gee \'n geldige hoeveelheid.'));
      if (modus === 'leen' && !d.na) return wysFout(f, new Error('Kies waarheen dit uitgeleen word.'));
      if ((modus === 'uit' || modus === 'leen' || modus === 'gebreek') && n > voorraadVan(barcode, d.lig)) {
        return wysFout(f, new Error(`Daar is net ${fmtN(voorraadVan(barcode, d.lig))} by ${ligNaam(d.lig)}.`));
      }
      const kn = $('button.vol', f);
      await metKnop(kn, async () => {
        try {
          if (modus === 'in' || modus === 'uit') {
            await skryf(modus === 'in' ? 'voorraad_in' : 'voorraad_uit', { barcode, liggingId: d.lig, hoeveelheid: n, nota: d.nota });
            plaaslikeLog(modus === 'in' ? 'IN' : 'UIT', barcode, d.lig, n, d.nota);
            toast(`${modus === 'in' ? '+' : '−'}${fmtN(n)} ${item.naam}`, 'goed');
          } else if (modus === 'tel') {
            await skryf('voorraad_tel', { barcode, liggingId: d.lig, hoeveelheid: n });
            plaaslikeLog('TEL', barcode, d.lig, n, '');
            toast(`${item.naam}: telling ${fmtN(n)} gestoor`, 'goed');
          } else if (modus === 'leen') {
            const r = await skryf('leen_uit', { barcode, vanLigging: d.lig, naLigging: d.na, hoeveelheid: n, persoon: d.persoon, epos: d.epos, selfoon: d.selfoon, terugDatum: d.terugDatum, nota: d.nota });
            plaaslikeLog('LEEN', barcode, d.lig, n, `${d.persoon} → ${ligNaam(d.na)}`);
            toast(`${fmtN(n)} ${item.naam} uitgeleen aan ${d.persoon}${r.uitleen.epos ? ' (kwitansie gestuur)' : ''}`, 'goed');
          } else if (modus === 'gebreek') {
            await skryf('gebreek_meld', { barcode, liggingId: d.lig, hoeveelheid: n, rede: d.rede });
            plaaslikeLog('GEBREEK', barcode, d.lig, n, d.rede);
            toast(`${fmtN(n)} ${item.naam} as gebreek gemeld`, 'goed');
          }
          stoor.stel(K.werk, d.lig);
          blad.sluit();
          herteken();
        } catch (err) { wysFout(f, err); }
      });
    };
  });
  return b;
}

function herteken() {
  // Teken die huidige skerm oor sonder om die kamera te herbegin
  teken();
  if (S.blad === 'skandeer' && laasteKode) wysResultaat(laasteKode);
  blaaie.forEach(b => b.herlaai && b.herlaai());
}

function wysItemDetail(barcode) {
  const b = maakBlad('Item', '', blad => {
    blad.herlaai = () => {
      const item = IX.item.get(barcode);
      if (!item) return blad.sluit();
      const gesk = S.log.filter(l => l.barcode === barcode).slice(-25).reverse();
      const breek = S.gebreek.filter(g => g.barcode === barcode).slice(-10).reverse();
      blad.lyf.innerHTML = itemKaart(item, item.aktief) + `
        <div class="twee" style="margin-bottom:12px"><button class="kn" id="wys">${IK.pen}<span>Wysig</span></button>
        <button class="kn" id="etk">${IK.etiket}<span>Druk etiket</span></button></div>
        ${item.beskrywing ? `<div class="kaart plat"><div class="sag klein">Beskrywing</div>${esc(item.beskrywing)}</div>` : ''}
        ${breek.length ? `<div class="afdeling">Gebreek</div><div class="lys">${breek.map(g => `<div class="el"><div class="hoof-teks"><b>${esc(ligNaam(g.liggingId))} · ${fmtD(g.datum)}</b><span class="sag klein">${esc(g.rede || '—')} · ${esc(g.deur)}</span></div><span class="etiket ${g.status === 'aangemeld' ? 'rooi' : g.status === 'herstel' ? 'groen' : 'grys'}">${esc(g.status)}</span><div class="getal">${fmtN(g.hoeveelheid)}</div></div>`).join('')}</div>` : ''}
        <div class="afdeling">Geskiedenis</div>
        ${gesk.length ? `<div class="lys">${gesk.map(logRy).join('')}</div>` : '<div class="kaart plat sag">Nog niks nie.</div>'}
        ${isAdmin() && item.aktief ? '<button class="kn gevaar vol" id="verw" style="margin-top:16px">Verwyder item</button>' : ''}
        ${isAdmin() && !item.aktief ? '<button class="kn hoof vol" id="herst" style="margin-top:16px">Herstel item</button>' : ''}`;
      koppelItemKaart(blad.lyf, item);
      $('#wys', blad.lyf).onclick = () => wysItemVorm(item);
      $('#etk', blad.lyf).onclick = () => { voegEtiketBy(item.barcode, 1); blad.sluit(); S.blad = 'etikette'; teken(); };
      if ($('#verw', blad.lyf)) $('#verw', blad.lyf).onclick = async () => {
        if (!await bevestig(`Verwyder "${item.naam}"? Dit sal nie meer gewys of geskandeer kan word nie. (Die geskiedenis bly in die Sheet.)`, 'Verwyder', true)) return;
        try { await skryf('item_verwyder', { barcode }); toast('Item verwyder', 'goed'); herteken(); } catch (e) { toast(e.message, 'fout'); }
      };
      if ($('#herst', blad.lyf)) $('#herst', blad.lyf).onclick = () => herstelItem(item);
    };
    blad.herlaai();
  });
  return b;
}
async function herstelItem(item) {
  try {
    await skryf('item_stoor', { barcode: item.barcode, naam: item.naam, kategorie: item.kategorie, eenheid: item.eenheid, beskrywing: item.beskrywing, minVoorraad: item.minVoorraad, aktief: true });
    toast('Item herstel', 'goed'); herteken();
  } catch (e) { toast(e.message, 'fout'); }
}

function logRy(l) {
  const it = IX.item.get(l.barcode);
  const naam = { IN: 'In', UIT: 'Uit', TEL: 'Getel', LEEN: 'Uitgeleen', TERUG: 'Terug', GEBREEK: 'Gebreek', HERSTEL: 'Herstel', AFSKRYF: 'Afgeskryf', ITEM_NUUT: 'Nuwe item', ITEM_WYSIG: 'Item gewysig', ITEM_VERWYDER: 'Item verwyder' }[l.aksie] || l.aksie.replace(/_/g, ' ').toLowerCase();
  const kleur = { IN: 'groen', TERUG: 'groen', HERSTEL: 'groen', UIT: 'amber', LEEN: 'amber', GEBREEK: 'rooi', AFSKRYF: 'rooi' }[l.aksie] || 'grys';
  return `<div class="el" ${l.barcode && it ? `data-bc="${esc(l.barcode)}"` : ''}><div class="hoof-teks"><b>${esc(it ? it.naam : (l.nota || l.barcode || ''))}</b>
    <span class="sag klein">${fmtDT(l.tyd)} · ${esc(l.gebruiker)}${l.liggingId ? ' · ' + esc(ligNaam(l.liggingId)) : ''}${l.nota && it ? ' · ' + esc(l.nota) : ''}</span></div>
    <span class="etiket ${kleur}">${esc(naam)}</span>${l.hoeveelheid ? `<div class="getal">${fmtN(l.hoeveelheid)}</div>` : ''}</div>`;
}

/* Nuwe item / wysig */
function wysItemVorm(item, kode) {
  const nuut = !item;
  const kategorieë = [...new Set(S.items.map(i => i.kategorie).filter(Boolean))].sort();
  const eenhede = [...new Set(['stuks', 'stelle', 'ml', 'g', 'L', 'kg', 'bottels', 'dose', ...S.items.map(i => i.eenheid).filter(Boolean)])];
  const html = `<form class="stapel" id="iv">
    <label class="veld"><span>Naam *</span><input class="inv" name="naam" required value="${esc(item?.naam || '')}" placeholder="bv. Beker 250 ml (glas)"></label>
    <label class="veld"><span>Strepieskode</span><input class="inv mono" name="barcode" value="${esc(item?.barcode || kode || '')}" ${nuut ? '' : 'readonly'} placeholder="Los leeg — die stelsel maak een (bv. 20260001)"></label>
    ${nuut ? '<p class="sag klein" style="margin:-4px 2px 0">Het die item reeds \'n fabriek-strepieskode? Skandeer of tik dit hier. Anders los dit leeg en druk later \'n etiket.</p>' : ''}
    <div class="twee"><label class="veld"><span>Kategorie</span><input class="inv" name="kategorie" list="katlys" value="${esc(item?.kategorie || '')}" placeholder="bv. Glasware"><datalist id="katlys">${kategorieë.map(k => `<option value="${esc(k)}">`).join('')}</datalist></label>
    <label class="veld"><span>Eenheid</span><input class="inv" name="eenheid" list="eenlys" value="${esc(item?.eenheid || 'stuks')}"><datalist id="eenlys">${eenhede.map(k => `<option value="${esc(k)}">`).join('')}</datalist></label></div>
    <label class="veld"><span>Minimum voorraad (waarskuwing)</span><input class="inv" name="minVoorraad" type="number" inputmode="decimal" step="any" min="0" value="${item?.minVoorraad || 0}"></label>
    <label class="veld"><span>Beskrywing</span><textarea class="inv" name="beskrywing" placeholder="opsioneel">${esc(item?.beskrywing || '')}</textarea></label>
    ${nuut && myLiggings().length ? `<div class="kaart plat stapel" style="margin:0"><b>Beginvoorraad</b><div class="twee"><label class="veld"><span>Ligging</span>${ligKeuse('liggingId', werkLigging())}</label>
      <label class="veld"><span>Hoeveelheid</span><input class="inv" name="hoeveelheid" type="number" inputmode="decimal" step="any" min="0" value="0"></label></div></div>` : ''}
    ${nuut ? '<label class="skakel"><input type="checkbox" name="druk" checked><span>Voeg by etikette om te druk</span></label>' : ''}
    <button class="kn hoof vol">${nuut ? 'Voeg item by' : 'Stoor veranderinge'}</button></form>`;
  maakBlad(nuut ? 'Nuwe item' : 'Wysig item', html, blad => {
    const f = $('#iv', blad.lyf);
    f.onsubmit = async e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(f));
      if (nuut && d.barcode && IX.item.has(d.barcode.trim())) return wysFout(f, new Error('Hierdie strepieskode bestaan reeds.'));
      await metKnop($('button.vol', f), async () => {
        try {
          const r = await skryf('item_stoor', { ...d, isNuut: nuut, druk: undefined, hoeveelheid: getal(d.hoeveelheid) || 0 });
          plaaslikeLog(nuut ? 'ITEM_NUUT' : 'ITEM_WYSIG', r.item.barcode, '', 0, r.item.naam);
          if (nuut && getal(d.hoeveelheid) > 0) plaaslikeLog('IN', r.item.barcode, d.liggingId, getal(d.hoeveelheid), 'Beginvoorraad');
          if (nuut && d.druk) voegEtiketBy(r.item.barcode, 1);
          toast(nuut ? `${r.item.naam} bygevoeg (${r.item.barcode})` : 'Gestoor', 'goed');
          blad.sluit();
          if (nuut) laasteKode = r.item.barcode;
          herteken();
        } catch (err) { wysFout(f, err); }
      });
    };
  });
}

/* Item-kieser */
function kiesItem({ titel, by, veelvoudig }) {
  return maakBlad(titel, `<div class="soek">${IK.soek}<input class="inv" id="ks" placeholder="Soek naam, kode of kategorie" autocomplete="off"></div><div id="kl"></div>`, blad => {
    const teken = () => {
      const q = $('#ks', blad.lyf).value.trim().toLowerCase();
      const lys = S.items.filter(i => i.aktief && (!q || (i.naam + ' ' + i.barcode + ' ' + i.kategorie).toLowerCase().includes(q)))
        .sort((a, b) => a.naam.localeCompare(b.naam)).slice(0, 60);
      $('#kl', blad.lyf).innerHTML = lys.length ? `<div class="lys">${lys.map(i => `<button class="el" data-bc="${esc(i.barcode)}"><div class="hoof-teks"><b>${esc(i.naam)}</b><span class="sag klein mono">${esc(i.barcode)}</span></div><div class="getal">${fmtN(totaalVan(i.barcode))}</div></button>`).join('')}</div>` : '<div class="leeg-lys">Niks gevind nie.</div>';
      $$('[data-bc]', blad.lyf).forEach(el => el.onclick = () => { const it = IX.item.get(el.dataset.bc); if (!veelvoudig) blad.sluit(); by(it); if (veelvoudig) { el.style.opacity = .4; } });
    };
    $('#ks', blad.lyf).oninput = teken;
    teken();
  });
}

/* ---------------------------------------------------------------------
   VOORRAAD
--------------------------------------------------------------------- */
let vFilter = { q: '', lig: '', leeg: false };
function tekenVoorraad() {
  const m = myLiggings();
  $('#inhoud').innerHTML = `
    <div class="soek">${IK.soek}<input class="inv" id="vq" placeholder="Soek naam, kode of kategorie" value="${esc(vFilter.q)}" autocomplete="off"></div>
    <div class="twee" style="margin-bottom:10px">${ligKeuse('vl', vFilter.lig, m, isAdmin() ? 'Alle liggings' : 'Al my liggings')}
      <label class="skakel klein"><input type="checkbox" id="vleeg" ${vFilter.leeg ? 'checked' : ''}><span>Wys ook items sonder voorraad</span></label></div>
    <div id="vlys"></div>
    <button class="fab" id="nuweItem" aria-label="Nuwe item">${IK.plus}</button>`;
  const lys = () => {
    const q = vFilter.q.toLowerCase();
    const items = S.items.filter(i => i.aktief && (!q || (i.naam + ' ' + i.barcode + ' ' + i.kategorie).toLowerCase().includes(q)))
      .map(i => {
        const hv = vFilter.lig ? voorraadVan(i.barcode, vFilter.lig) : totaalVan(i.barcode);
        const geleen = oopLenings(i.barcode).filter(l => !vFilter.lig || l.vanLigging === vFilter.lig).reduce((s, l) => s + uitstaande(l), 0);
        return { i, hv, geleen };
      })
      .filter(x => vFilter.leeg || q || x.hv > 0 || x.geleen > 0)
      .sort((a, b) => (a.i.kategorie || '~').localeCompare(b.i.kategorie || '~') || a.i.naam.localeCompare(b.i.naam));
    if (!items.length) {
      $('#vlys').innerHTML = `<div class="kaart leeg-lys">${S.items.length ? 'Geen items pas nie.' : 'Nog geen items nie. Druk <b>+</b> om die eerste item by te voeg.'}</div>`;
      return;
    }
    let kat = null, html = '';
    items.forEach(({ i, hv, geleen }) => {
      const k = i.kategorie || 'Sonder kategorie';
      if (k !== kat) { if (kat !== null) html += '</div>'; html += `<div class="afdeling">${esc(k)}</div><div class="lys">`; kat = k; }
      const laag = isAdmin() && i.minVoorraad > 0 && totaalVan(i.barcode) < i.minVoorraad;
      html += `<button class="el ${hv > 0 ? '' : 'dof'}" data-bc="${esc(i.barcode)}"><div class="hoof-teks"><b>${esc(i.naam)}</b><span class="sag klein mono">${esc(i.barcode)}</span></div>
        ${laag ? '<span class="etiket amber">Laag</span>' : ''}${geleen ? `<span class="etiket">${fmtN(geleen)} geleen</span>` : ''}<div class="getal">${fmtN(hv)}</div></button>`;
    });
    $('#vlys').innerHTML = html + '</div>';
    $$('#vlys [data-bc]').forEach(el => el.onclick = () => wysItemDetail(el.dataset.bc));
  };
  $('#vq').oninput = e => { vFilter.q = e.target.value; lys(); };
  $('select[name=vl]').onchange = e => { vFilter.lig = e.target.value; lys(); };
  $('#vleeg').onchange = e => { vFilter.leeg = e.target.checked; lys(); };
  $('#nuweItem').onclick = () => wysItemVorm(null);
  lys();
}

/* ---------------------------------------------------------------------
   UITLEEN
--------------------------------------------------------------------- */
let uOortjie = 'oop';
function tekenUitleen() {
  const oop = oopLenings().sort((a, b) => (a.terugDatum || '9').localeCompare(b.terugDatum || '9'));
  const laat = oop.filter(isLaat);
  const terug = S.uitlenings.filter(l => l.status !== 'oop').sort((a, b) => (b.terugOp || '').localeCompare(a.terugOp || '')).slice(0, 60);
  const virMy = versoekeVirMy();
  const myne = S.versoeke.filter(v => v.versoekerId === S.gebruiker.id && v.status === 'wag');
  $('#inhoud').innerHTML = `
    <div class="skyfies" style="margin-bottom:12px">
      <button class="skyf ${uOortjie === 'oop' ? 'aan' : ''}" data-o="oop">Uitstaande (${oop.length})</button>
      <button class="skyf ${uOortjie === 'laat' ? 'aan' : ''}" data-o="laat">Laat (${laat.length})</button>
      <button class="skyf ${uOortjie === 'versoeke' ? 'aan' : ''}" data-o="versoeke">Versoeke${virMy.length + myne.length ? ` (${virMy.length + myne.length})` : ''}</button>
      <button class="skyf ${uOortjie === 'terug' ? 'aan' : ''}" data-o="terug">Terugbesorg</button></div>
    <div id="uLyf"></div>
    <button class="fab" id="nuweLeen" aria-label="${uOortjie === 'versoeke' ? 'Nuwe versoek' : 'Nuwe uitleen'}">${IK.plus}</button>`;
  if (uOortjie === 'versoeke') tekenVersoeke($('#uLyf'));
  else {
    const lys = { oop, laat, terug }[uOortjie];
    $('#uLyf').innerHTML = lys.length ? lys.map(leenKaart).join('') : `<div class="kaart leeg-lys">${uOortjie === 'laat' ? 'Niks is laat nie. 👍' : 'Niks hier nie.'}</div>`;
    $$('[data-terug]').forEach(b => b.onclick = () => terugbesorg(b.dataset.terug));
    $$('[data-item]').forEach(b => b.onclick = () => wysItemDetail(b.dataset.item));
  }
  $$('[data-o]').forEach(b => b.onclick = () => { uOortjie = b.dataset.o; tekenUitleen(); });
  $('#nuweLeen').onclick = () => uOortjie === 'versoeke'
    ? kiesItem({ titel: 'Wat wil jy leen?', by: it => kiesBron(it) })
    : kiesItem({ titel: 'Wat word uitgeleen?', by: it => openAksie('leen', it.barcode, werkLigging()) });
}

/* ---------------------------------------------------------------------
   VERSOEKE — iemand wil iets uit 'n ander lab leen
--------------------------------------------------------------------- */
const VS_STATUS = { wag: ['Wag', 'amber'], goedgekeur: ['Goedgekeur', 'groen'], afgekeur: ['Afgekeur', 'rooi'], gekanselleer: ['Gekanselleer', 'grys'] };
function eldersBeskikbaar(bc) {
  return S.voorraad.filter(v => v.barcode === bc && v.hoeveelheid > 0 && !magLig(v.liggingId) && IX.lig.get(v.liggingId)?.aktief)
    .sort((a, b) => b.hoeveelheid - a.hoeveelheid);
}
function kiesBron(item) {
  const bronne = S.voorraad.filter(v => v.barcode === item.barcode && v.hoeveelheid > 0 && IX.lig.get(v.liggingId)?.aktief && (!isAdmin() ? !magLig(v.liggingId) : true));
  if (!bronne.length) return toast(`${item.naam} is nie elders beskikbaar nie.`, 'fout');
  if (bronne.length === 1) return versoekVorm(item.barcode, bronne[0].liggingId);
  maakBlad('Uit watter lab?', `<div class="lys">${bronne.map(v => `<button class="el" data-l="${esc(v.liggingId)}"><div class="hoof-teks"><b>${esc(ligNaam(v.liggingId))}</b></div><div class="getal">${fmtN(v.hoeveelheid)}</div></button>`).join('')}</div>`, b => {
    $$('[data-l]', b.lyf).forEach(el => el.onclick = () => { b.sluit(); versoekVorm(item.barcode, el.dataset.l); });
  });
}
function versoekVorm(barcode, vanLig) {
  const item = IX.item.get(barcode);
  const beskikbaar = voorraadVan(barcode, vanLig);
  const na = myLiggings().filter(l => l.id !== vanLig);
  if (!na.length) return toast('Jy het nog geen eie klas of lab waarheen dit kan gaan nie. Vra die admin.', 'fout');
  const terug = new Date(); terug.setDate(terug.getDate() + 7);
  maakBlad('Versoek om te leen', `
    <div class="ry tussen" style="margin-bottom:12px"><div><b>${esc(item.naam)}</b><div class="sag klein mono">${esc(item.barcode)}</div></div>
      <div style="text-align:right"><div class="sag klein">Beskikbaar in ${esc(ligNaam(vanLig))}</div><b>${fmtN(beskikbaar)}</b> <span class="sag klein">${esc(item.eenheid || '')}</span></div></div>
    <form class="stapel" id="vf">
      <label class="veld"><span>Hoeveel?</span><div class="stapper"><button type="button" data-d="-1">−</button><input name="hoeveelheid" type="number" inputmode="decimal" step="any" min="0" max="${beskikbaar}" value="1" data-fokus="nee"><button type="button" data-d="1">+</button></div></label>
      <label class="veld"><span>Na watter van jou liggings?</span>${ligKeuse('naLigging', werkLigging(), na)}</label>
      <div class="twee"><label class="veld"><span>Nodig op</span><input class="inv" name="nodigOp" type="date" min="${isoDag(new Date())}"></label>
      <label class="veld"><span>Terug teen</span><input class="inv" name="terugDatum" type="date" value="${isoDag(terug)}" min="${isoDag(new Date())}"></label></div>
      <label class="veld"><span>Waarvoor? (word saam gestuur)</span><textarea class="inv" name="nota" placeholder="bv. Graad 11 prakties, Donderdag 2de periode"></textarea></label>
      <p class="sag klein" style="margin:0">Die onderwyser verantwoordelik vir ${esc(ligNaam(vanLig))} kry 'n e-pos en kan dit goed- of afkeur.</p>
      <button class="kn hoof vol">Stuur versoek</button></form>`, blad => {
    const f = $('#vf', blad.lyf);
    $$('.stapper button', f).forEach(k => k.onclick = () => { const n = getal(f.hoeveelheid.value) || 0; f.hoeveelheid.value = Math.min(beskikbaar, Math.max(0, n + Number(k.dataset.d))); });
    f.onsubmit = async e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(f));
      const n = getal(d.hoeveelheid);
      if (!(n > 0 && n <= beskikbaar)) return wysFout(f, new Error(`Kies 'n hoeveelheid tussen 1 en ${fmtN(beskikbaar)}.`));
      await metKnop($('button.vol', f), async () => {
        try {
          const r = await skryf('versoek_skep', { ...d, hoeveelheid: n, barcode, vanLigging: vanLig, toepUrl: location.origin + location.pathname });
          toast(r.ontvangers ? `Versoek gestuur — ${r.ontvangers} persoon${r.ontvangers === 1 ? '' : 'e'} kry 'n e-pos` : 'Versoek gestoor', 'goed');
          blad.sluit(); uOortjie = 'versoeke'; herteken();
        } catch (err) { wysFout(f, err); }
      });
    };
  });
}
function versoekKaart(v, rol) {
  const it = IX.item.get(v.barcode);
  const [st, kl] = VS_STATUS[v.status] || [v.status, 'grys'];
  return `<div class="kaart">
    <div class="ry tussen"><div style="min-width:0"><b data-item="${esc(v.barcode)}" style="cursor:pointer">${esc(it?.naam || v.barcode)}</b>
      <div class="sag klein">${esc(ligNaam(v.vanLigging))} → ${esc(ligNaam(v.naLigging))}</div></div>
      <div style="text-align:right"><div class="totaal" style="font-size:1.5rem">${fmtN(v.hoeveelheid)}</div><span class="etiket ${kl}">${st}</span></div></div>
    <ul class="voorraadlys">
      <li><span class="sag">Versoek deur</span><span>${esc(v.versoeker)}</span></li>
      <li><span class="sag">Gestuur</span><span>${fmtDT(v.geskep)}</span></li>
      ${v.nodigOp ? `<li><span class="sag">Nodig op</span><span>${fmtD(v.nodigOp)}</span></li>` : ''}
      ${v.terugDatum ? `<li><span class="sag">Terug teen</span><span>${fmtD(v.terugDatum)}</span></li>` : ''}
      ${v.nota ? `<li><span class="sag">Waarvoor</span><span>${esc(v.nota)}</span></li>` : ''}
      ${v.status !== 'wag' ? `<li><span class="sag">${v.status === 'gekanselleer' ? 'Gekanselleer' : 'Antwoord'} deur</span><span>${esc(v.antwoordDeur)} · ${fmtD(v.antwoordOp)}</span></li>` : ''}
      ${v.antwoordNota ? `<li><span class="sag">Nota</span><span>${esc(v.antwoordNota)}</span></li>` : ''}</ul>
    ${rol === 'antwoord' ? `<div class="twee" style="margin-top:12px"><button class="kn gevaar" data-nee="${esc(v.id)}">Keur af</button><button class="kn hoof" data-ja="${esc(v.id)}">Keur goed</button></div>` : ''}
    ${rol === 'myne' && v.status === 'wag' ? `<button class="kn vol klein" style="margin-top:12px" data-kans="${esc(v.id)}">Kanselleer versoek</button>` : ''}
  </div>`;
}
function tekenVersoeke(houer) {
  const virMy = versoekeVirMy().sort((a, b) => (a.geskep || '').localeCompare(b.geskep || ''));
  const myne = S.versoeke.filter(v => v.versoekerId === S.gebruiker.id).sort((a, b) => (b.geskep || '').localeCompare(a.geskep || '')).slice(0, 30);
  const ander = S.versoeke.filter(v => v.status !== 'wag' && v.versoekerId !== S.gebruiker.id).sort((a, b) => (b.antwoordOp || '').localeCompare(a.antwoordOp || '')).slice(0, 20);
  houer.innerHTML = `
    <div class="afdeling">Wag vir jou antwoord (${virMy.length})</div>
    ${virMy.length ? virMy.map(v => versoekKaart(v, 'antwoord')).join('') : '<div class="kaart plat sag">Niemand wag op jou nie.</div>'}
    <div class="afdeling">My versoeke</div>
    ${myne.length ? myne.map(v => versoekKaart(v, 'myne')).join('') : '<div class="kaart plat sag">Jy het nog niks versoek nie. Druk <b>+</b>, of maak \'n item oop en kies <b>Versoek</b> by \'n ander lab.</div>'}

/**
 * Gee 'n lys stafwydtes (stafie, spasie, stafie, …) in modules terug.
 * Code 128 met outomatiese keuse tussen stel B (teks) en stel C (syferpare),
 * sodat syfer-kodes soos 20240001 die helfte so breed is.
 */
function code128Waardes(teks) {
  const s = String(teks);
  if (!s.length) throw new Error('Leë strepieskode.');
  for (const ch of s) {
    const c = ch.charCodeAt(0);
    if (c < 32 || c > 126) throw new Error(`Die karakter "${ch}" kan nie in 'n strepieskode nie.`);
  }
  const isSyf = i => i < s.length && s.charCodeAt(i) >= 48 && s.charCodeAt(i) <= 57;
  const syfers = i => { let n = 0; while (isSyf(i + n)) n++; return n; };
  const w = [];
  let stel, i = 0;
  const eerste = syfers(0);
  if (eerste >= 4 || (eerste === s.length && eerste >= 2)) {
    stel = 'C'; w.push(105);
  } else { stel = 'B'; w.push(104); }
  while (i < s.length) {
    if (stel === 'C') {
      if (syfers(i) >= 2) { w.push(Number(s.substr(i, 2))); i += 2; continue; }
      w.push(100); stel = 'B'; continue;
    }
    const n = syfers(i);
    if (n >= 6 || (n >= 4 && i + n === s.length)) {
      if (n % 2) { w.push(s.charCodeAt(i) - 32); i++; }
      w.push(99); stel = 'C'; continue;
    }
    w.push(s.charCodeAt(i) - 32); i++;
  }
  let som = w[0];
  for (let k = 1; k < w.length; k++) som += w[k] * k;
  w.push(som % 103, 106);
  return w;
}
function code128(teks) {
  return code128Waardes(teks).flatMap(v => C128[v].split('').map(Number));
}

function strepieSvg(teks) {
  const w = code128(teks);
  const tot = w.reduce((a, b) => a + b, 0) + 20;
  let x = 10, d = '';
  w.forEach((b, i) => { if (i % 2 === 0) d += `M${x} 0h${b}v50h-${b}z`; x += b; });
  return `<svg viewBox="0 0 ${tot} 50" preserveAspectRatio="none"><path d="${d}" fill="#000"/></svg>`;
}

class KleinPdf {
  constructor(bw = 210, bh = 297) { this.bw = bw; this.bh = bh; this.blaaie = []; this.nuweBlad(); }
  nuweBlad() { this.ops = []; this.blaaie.push(this.ops); }
  pt(mm) { return (mm * 72 / 25.4).toFixed(3); }
  breedte(t, grootte, vet) { const w = HW[vet ? 'F2' : 'F1']; let s = 0; for (const ch of t) s += w[winKode(ch) - 32] || 556; return s * grootte / 1000 * 25.4 / 72; }
  pas(t, maks, grootte, vet) {
    if (this.breedte(t, grootte, vet) <= maks) return t;
    while (t.length > 1 && this.breedte(t + '…', grootte, vet) > maks) t = t.slice(0, -1);
    return t.trimEnd() + '…';
  }
  vou(t, maks, grootte, vet, lyne) {
    const woorde = t.split(/\s+/); const uit = []; let ry = '';
    for (const w of woorde) {
      const toets = ry ? ry + ' ' + w : w;
      if (this.breedte(toets, grootte, vet) <= maks || !ry) ry = toets; else { uit.push(ry); ry = w; }
    }
    if (ry) uit.push(ry);
    if (uit.length > lyne) { uit.length = lyne; uit[lyne - 1] = this.pas(uit[lyne - 1] + ' …', maks, grootte, vet); }
    return uit.map(r => this.pas(r, maks, grootte, vet));
  }
  reghoek(x, y, w, h) { this.ops.push(`${this.pt(x)} ${this.pt(this.bh - y - h)} ${this.pt(w)} ${this.pt(h)} re f`); }
  vul(x, y, w, h, kleur) { this.ops.push(`q ${kleur.join(' ')} rg ${this.pt(x)} ${this.pt(this.bh - y - h)} ${this.pt(w)} ${this.pt(h)} re f Q`); }
  streep(x1, y1, x2, y2, grys = .8, dik = .2) { this.ops.push(`q ${grys} G ${dik} w ${this.pt(x1)} ${this.pt(this.bh - y1)} m ${this.pt(x2)} ${this.pt(this.bh - y2)} l S Q`); }
  lyn(x1, y1, x2, y2, grys = .75) { this.ops.push(`q ${grys} G 0.25 w [2 2] 0 d ${this.pt(x1)} ${this.pt(this.bh - y1)} m ${this.pt(x2)} ${this.pt(this.bh - y2)} l S Q`); }
  teks(t, x, y, grootte, { vet = false, belyn = 'links', grys = 0 } = {}) {
    let bytes = '';
    for (const ch of t) {
      const k = winKode(ch);
      if (ch === '(' || ch === ')' || ch === '\\') bytes += '\\' + ch;
      else if (k < 32 || k > 126) bytes += '\\' + k.toString(8).padStart(3, '0');
      else bytes += String.fromCharCode(k);
    }
    const w = this.breedte(t, grootte, vet);
    const x0 = belyn === 'middel' ? x - w / 2 : belyn === 'regs' ? x - w : x;
    this.ops.push(`BT ${grys} g /${vet ? 'F2' : 'F1'} ${grootte} Tf ${this.pt(x0)} ${this.pt(this.bh - y)} Td (${bytes}) Tj ET 0 g`);
  }
  bou() {
    const obj = [];
    const n = this.blaaie.length;
    obj[1] = '<< /Type /Catalog /Pages 2 0 R >>';
    obj[2] = `<< /Type /Pages /Count ${n} /Kids [${this.blaaie.map((_, i) => `${5 + i * 2} 0 R`).join(' ')}] >>`;
    obj[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    obj[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
    this.blaaie.forEach((ops, i) => {
      const inhoud = ops.join('\n');
      obj[5 + i * 2] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.pt(this.bw)} ${this.pt(this.bh)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6 + i * 2} 0 R >>`;
      obj[6 + i * 2] = `<< /Length ${inhoud.length} >>\nstream\n${inhoud}\nendstream`;
    });
    let uit = '%PDF-1.4\n';
    const posisies = [];
    for (let i = 1; i < obj.length; i++) { posisies[i] = uit.length; uit += `${i} 0 obj\n${obj[i]}\nendobj\n`; }
    const xref = uit.length;
    uit += `xref\n0 ${obj.length}\n0000000000 65535 f \n` + posisies.slice(1).map(p => String(p).padStart(10, '0') + ' 00000 n \n').join('');
    uit += `trailer\n<< /Size ${obj.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
    const bytes = new Uint8Array(uit.length);
    for (let i = 0; i < uit.length; i++) bytes[i] = uit.charCodeAt(i) & 255;
    return bytes;
  }
}

function etiketInstellings() {
  return Object.assign({ lys: [], uitleg: 'w115', begin: 1, skool: false, naam: true, dx: 0, dy: 0 }, stoor.kry(K.etiket, {}));
}
function stelEtiket(e) { stoor.stel(K.etiket, e); }
function voegEtiketBy(barcode, aantal) {
  const e = etiketInstellings();
  const b = e.lys.find(x => x.bc === barcode);
  if (b) b.n += aantal; else e.lys.push({ bc: barcode, n: aantal });
  stelEtiket(e);
}

function maakEtiketPdf(e) {
  const U = UITLEGTE[e.uitleg] || UITLEGTE.w115;
  const perBlad = U.kol * U.ry;
  const reeks = [];
  e.lys.forEach(x => { const it = IX.item.get(x.bc); if (it) for (let i = 0; i < x.n; i++) reeks.push(it); });
  if (!reeks.length) throw new Error('Voeg eers items by.');
  const pdf = new KleinPdf();
  const skool = e.skool ? (S.instellings.skool || '') : '';
  let plek = Math.max(0, Math.min(perBlad - 1, (Number(e.begin) || 1) - 1));
  const snylyne = () => {
    if (!U.sny) return;
    for (let c = 0; c <= U.kol; c++) { const x = U.x + c * U.w + e.dx; pdf.lyn(x, U.y + e.dy - 4, x, U.y + U.ry * U.h + e.dy + 4); }
    for (let r = 0; r <= U.ry; r++) { const y = U.y + r * U.h + e.dy; pdf.lyn(U.x + e.dx - 4, y, U.x + U.kol * U.w + e.dx + 4, y); }
  };
  snylyne();
  reeks.forEach(item => {
    if (plek >= perBlad) { pdf.nuweBlad(); snylyne(); plek = 0; }
    const c = plek % U.kol, r = Math.floor(plek / U.kol);
    const x = U.x + c * (U.w + U.gx) + e.dx, y = U.y + r * (U.h + U.gy) + e.dy;
    teken1Etiket(pdf, item, x, y, U.w, U.h, skool, e.naam !== false);
    plek++;
  });
  return pdf.bou();
}

function teken1Etiket(pdf, item, x, y, w, h, skool, metNaam = true) {
  const pad = Math.min(3, w * .05);
  const binne = w - 2 * pad;
  let yy = y + pad;
  const klein = h < 32;
  if (skool) { yy += 2; pdf.teks(pdf.pas(skool, binne, 5.5), x + w / 2, yy, 5.5, { belyn: 'middel', grys: .4 }); yy += .8; }
  if (metNaam) {
    const ng = klein ? 7 : 9;
    const lyne = pdf.vou(item.naam, binne, ng, true, h >= 40 ? 2 : 1);
    lyne.forEach(l => { yy += ng * .3528 + .6; pdf.teks(l, x + w / 2, yy, ng, { vet: true, belyn: 'middel' }); });
    yy += 1.5;
  } else yy += 1;
  const kodeGrootte = klein ? 8 : 9;
  const onder = y + h - pad - kodeGrootte * .3528 - .8;
  const stafH = Math.max(6, Math.min(onder - yy, 20));
  const wydtes = code128(item.barcode);
  const modules = wydtes.reduce((a, b) => a + b, 0);
  const mod = Math.min(.5, binne / (modules + 20));
  let bx = x + (w - modules * mod) / 2;
  wydtes.forEach((b, i) => { if (i % 2 === 0) pdf.reghoek(bx, yy, b * mod, stafH); bx += b * mod; });
  pdf.teks(item.barcode, x + w / 2, yy + stafH + kodeGrootte * .3528 + .6, kodeGrootte, { belyn: 'middel' });
}
